                <div class="cards grey">
                    <div id="pick" class="ticker" *ngFor="let resumenM of cardsUS">
 
                        <div *ngIf="resumenM.tipo == 'Total'" class="icon-wrapper">
                            <img src="assets/truck.png" class="devextreme-logo">
                        </div>
                        <div *ngIf="resumenM.tipo == 'Cargados'" class="icon-wrapper">
                            <img src="assets/deliveryTruck.png" class="devextreme-logo">
                        </div>
                        <div *ngIf="resumenM.tipo == 'Vacios'" class="icon-wrapper">
                            <img src="assets/truckVacios.png" class="devextreme-logo">
                        </div>
                        <div *ngIf="resumenM.tipo == 'Programado'" class="icon-wrapper">

                        <div *ngIf="resumenM.tipo == 'Sin Viajes'" class="icon-wrapper">

                        </div>
                        <div *ngIf="resumenM.tipo == 'Taller'" class="icon-wrapper">

                        </div>
                        <div *ngIf="resumenM.tipo == 'Siniestrado'" class="icon-wrapper">
                            <img src="assets/siniestrado.png" class="devextreme-logo">
                        </div>
                        

                        <div  class="middle">
                            <div class="title"> {{ resumenM.tipo }} </div>
                            <div *ngIf="resumenM.tipo !== 'Cargados'" class="total"> {{resumenM.total }} </div>
                            <div *ngIf="resumenM.tipo == 'Cargados'&& myColor == '#03af4b'" style="color: #03af4b;" class="total"> {{resumenM.total }} </div>
